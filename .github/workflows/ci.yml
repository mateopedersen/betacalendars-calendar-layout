name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: native
          - os: windows-latest
            compiler: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (native compiler)
        if: matrix.compiler == 'native'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBETACALENDARS_BUILD_TESTS=ON -DBETACALENDARS_BUILD_TOOLS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Configure (Linux GCC/Clang)
        if: matrix.compiler != 'native'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DBETACALENDARS_BUILD_TESTS=ON -DBETACALENDARS_BUILD_TOOLS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release
      - name: Configure installed consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage -DCMAKE_BUILD_TYPE=Release
      - name: Build installed consumer
        run: cmake --build consumer-build --config Release --parallel

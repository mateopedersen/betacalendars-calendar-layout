name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBETACALENDARS_BUILD_TESTS=ON -DBETACALENDARS_BUILD_TOOLS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install package
        run: cmake --install build --config ${{ matrix.build_type }}
      - name: Configure installed consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build installed consumer
        run: cmake --build consumer-build --config ${{ matrix.build_type }} --parallel
